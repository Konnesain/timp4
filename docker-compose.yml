services:
  db:
    image: postgres:18-alpine
    environment:
      TZ: Asia/Novosibirsk
      POSTGRES_DB: timpdb
      POSTGRES_USER: timp
      POSTGRES_PASSWORD: timp
    ports:
      - "2002:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timp -d timpdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      TZ: Asia/Novosibirsk
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/timpdb
      SPRING_DATASOURCE_USERNAME: timp
      SPRING_DATASOURCE_PASSWORD: timp
    ports:
      - "2001:2001"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./spa
      dockerfile: Dockerfile
    environment:
      TZ: Asia/Novosibirsk
      API_PROXY_TARGET: http://backend:2001
    ports:
      - "2000:2000"
    depends_on:
      - backend

volumes:
  pgdata:
